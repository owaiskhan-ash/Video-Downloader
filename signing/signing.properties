# Release signing for Teal.
#
# keyPassword must equal storePassword: PKCS12 is a single-password format
# and openssl writes one password for the whole store. A separate key
# password fails at packageRelease with "Given final block not properly
# padded", which reads like a corrupt keystore but is only a wrong password.
#
# These values unlock signing/teal-release.p12, which is committed to this
# public repository on purpose. See signing/README.md for the tradeoff that was
# accepted and how to move to a private key without breaking existing installs.
storeFile=signing/teal-release.p12
storePassword=6820079bb1cb26d05b04dd8d5616dcfb
keyAlias=teal
keyPassword=6820079bb1cb26d05b04dd8d5616dcfb
storeType=PKCS12
