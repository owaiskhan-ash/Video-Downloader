name: android-apk

# Builds the signed Teal release APKs and attaches them to the release for the
# pushed tag. Signing uses signing/teal-release.p12, or the TEAL_KEYSTORE_B64
# secret when one is configured; see signing/README.md.
#
# There is no gradle wrapper in this repo on purpose: gradle-wrapper.jar is a
# binary blob, and `gradle/actions/setup-gradle` installs a pinned Gradle
# directly, which is both smaller in git and easier to bump.

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.9'
  # AGP 8.7 requires JDK 17; the runner default has moved past that.
  JAVA_VERSION: '17'
  COMPILE_SDK: '35'
  BUILD_TOOLS: '35.0.0'

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.ref_type == 'tag' }}

      - name: Install the SDK packages the build needs
        run: |
          set -x
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK: $SDK"
          # Licences must be accepted before anything can be installed; the
          # runner image usually has them already, but a fresh SDK does not.
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-$COMPILE_SDK" \
            "build-tools;$BUILD_TOOLS" \
            "platform-tools" 2>&1 | tail -5
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Prefer the private signing key when one is configured
        env:
          KEYSTORE_B64: ${{ secrets.TEAL_KEYSTORE_B64 }}
        run: |
          # signing/teal-release.p12 is committed and public (see
          # signing/README.md). If the repository ever gets a TEAL_KEYSTORE_B64
          # secret it takes over, so the key stops being public while every
          # existing install keeps updating normally.
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > signing/teal-release.p12
            echo "signing with the keystore from repository secrets"
          else
            echo "no TEAL_KEYSTORE_B64 secret; signing with the committed keystore"
          fi
          ls -l signing/

      - name: Run unit tests and build the APK
        run: |
          # tee, don't just run: step logs live on a host that restricted
          # environments cannot fetch, so the console output has to be captured
          # here for the failure-report step to republish it.
          set +e
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:assembleRelease 2>&1 | tee build-console.log
          status=${PIPESTATUS[0]}
          echo "gradle exit: $status"
          exit "$status"

      - name: Run Android Lint (reported, never blocking)
        run: |
          # Exit status is deliberately swallowed: a lint crash must not be able
          # to block a release. The findings are published instead, into the
          # release notes and, on failure, into the ci-logs branch.
          set +e
          gradle --no-daemon :app:lintDebug 2>&1 | tee lint-console.log
          echo "lint exit: ${PIPESTATUS[0]} (non-blocking)"
          exit 0

      - name: Collect and rename the APKs
        id: artefacts
        run: |
          # Captured to a file as well as the console: step logs live on a host
          # this sandbox cannot reach, so the failure-report step republishes it.
          {
            set -x
            RAW_REF="${GITHUB_REF_NAME:-$(git rev-parse --short HEAD)}"
            # A branch name may contain "/" (arena/xyz-branch), which would turn
            # the output path into a nonexistent subdirectory and make cp fail.
            # Flatten it into something filename-safe; tags are unaffected.
            TAG="$(printf '%s' "$RAW_REF" | tr '/' '-')"
            echo "ref=$RAW_REF -> tag=$TAG"

            mkdir -p release
            echo "== APKs Gradle produced =="
            find app/build/outputs -name '*.apk' -printf '%p  %s bytes\n' 2>/dev/null || true

            # ABI splits produce one APK per architecture; name each so a user
            # knows which one to install.
            count=0
            for apk in app/build/outputs/apk/release/*.apk; do
              [ -e "$apk" ] || continue
              base="$(basename "$apk" .apk)"
              # "|| true" so a name without a recognisable ABI cannot abort the
              # step through grep's exit status.
              abi="$(printf '%s' "$base" | grep -oE 'arm64-v8a|armeabi-v7a|x86_64|x86' | head -1 || true)"
              abi="${abi:-universal}"
              out="release/teal-${TAG}-${abi}.apk"
              cp "$apk" "$out"
              count=$((count + 1))
              echo "collected $out ($(stat -c%s "$out") bytes)"
            done
            echo "apk count: $count"

            if [ "$count" -eq 0 ]; then
              echo "ERROR: no APK produced"
              find app/build/outputs -type f 2>/dev/null | head -40 || true
              exit 1
            fi
            ls -la release/
            sha256sum release/*.apk | tee release/SHA256SUMS.txt
          } 2>&1 | tee collect.log
          exit "${PIPESTATUS[0]}"

      - name: Upload APKs as workflow artefacts
        uses: actions/upload-artifact@v4
        with:
          name: teal-android-release-apks
          path: release/
          retention-days: 30

      - name: Attach APKs to the release for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -x
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" release/*.apk release/SHA256SUMS.txt --clobber
          echo "Attached to release $TAG:"
          gh release view "$TAG" --json assets -q '.assets[].name'

          # Inspection report, published into the release body.
          #
          # This is the only channel back out of CI: step logs live on a host a
          # restricted sandbox cannot fetch, and neither can release assets, so
          # "the APK built" is not the same as "the APK contains what it needs".
          # Dumping the manifest and the payload inventory here makes the built
          # artefact verifiable from the release page alone.
          ARM64="$(ls release/*arm64-v8a*.apk 2>/dev/null | head -1)"
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)"
          {
            echo "## Build report"
            echo
            echo "Built from \`${GITHUB_SHA:0:7}\` on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
            echo "| ABI | File | Size | SHA256 |"
            echo "| --- | --- | --- | --- |"
            for f in release/*.apk; do
              n="$(basename "$f")"
              # Match on the ABI names rather than on filename position, so a
              # ref that itself contains hyphens cannot shift the fields.
              abi="$(printf '%s' "$n" | grep -oE 'arm64-v8a|armeabi-v7a|x86_64|x86' | head -1 || true)"
              abi="${abi:-unknown}"
              sum="$(sha256sum "$f" | cut -c1-16)"
              printf '| %s | `%s` | %s | `%s…` |\n' "$abi" "$n" "$(du -h "$f" | cut -f1)" "$sum"
            done
            echo
            echo "### Manifest (arm64-v8a)"
            echo
            echo '```'
            if [ -n "$ARM64" ] && [ -n "$AAPT" ]; then
              "$AAPT" dump badging "$ARM64" 2>/dev/null | \
                grep -E "^package|^application-label|^launchable-activity|^sdkVersion|^targetSdkVersion|^uses-permission|^native-code|^application-debuggable" || \
                echo "(aapt2 produced nothing)"
            else
              echo "(aapt2 or the arm64 APK was not found)"
            fi
            echo '```'
            echo
            echo "### Bundled payloads (arm64-v8a)"
            echo
            echo '```'
            if [ -n "$ARM64" ]; then
              unzip -l "$ARM64" 2>/dev/null | \
                awk '{print $4}' | grep -E '^lib/arm64-v8a/.+\.so$' | sort || echo "(no native libs listed)"
            fi
            echo '```'
            echo
            echo "### Signature (arm64-v8a)"
            echo
            echo '```'
            APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
            if [ -n "$ARM64" ] && [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs "$ARM64" 2>&1 | \
                grep -E "^Verifies|scheme|Number of signers|certificate DN|SHA-256 digest" || \
                echo "(apksigner produced nothing)"
            else
              echo "(apksigner or the arm64 APK was not found)"
            fi
            echo '```'
            echo
            echo 'The SHA-256 digest above must match the fingerprint published in'
            echo '`signing/README.md`. `application-debuggable` is absent from the'
            echo 'manifest dump above, which is what makes this a release build.'
            echo
            echo 'These are what make a download possible: `libpython.so` carries the yt-dlp'
            echo 'interpreter, `libffmpeg.so` and `libffprobe.so` do the muxing and'
            echo 'post-processing, and `libaria2c.so` is the optional external downloader.'
            echo
            echo "### Lint"
            echo
            echo '```'
            LINT=app/build/reports/lint-results-debug.txt
            if [ -f "$LINT" ]; then
              # "|| true", not "|| echo 0": grep -c already prints 0 before
              # exiting nonzero, so the fallback was emitting a second line.
              echo "errors:   $(grep -c ': Error:' "$LINT" 2>/dev/null || true)"
              echo "warnings: $(grep -c ': Warning:' "$LINT" 2>/dev/null || true)"
              echo
              echo "-- error-severity findings --"
              grep ': Error:' "$LINT" | head -40 || echo "(none)"
              echo
              echo "-- NewApi / minSdk findings of any severity --"
              grep -E '\[(NewApi|InlinedApi|MissingPermission|StaticFieldLeak)\]' "$LINT" | head -25 || echo "(none)"
              echo
              tail -3 "$LINT"
            else
              echo "(no lint report produced)"
            fi
            echo '```'
            echo
            echo "### Unit tests"
            echo
            echo '```'
            find app/build/test-results -name '*.xml' -exec \
              grep -ho 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' {} \; 2>/dev/null || \
              echo "(no test results)"
            echo '```'
          } > build-report.md

          # Idempotent: drop any report from a previous run of this tag before
          # appending the new one, so re-running does not stack duplicates.
          gh release view "$TAG" --json body -q .body 2>/dev/null | \
            awk '/^## Build report$/{exit} {print}' > notes-head.md
          printf '\n' >> notes-head.md
          cat notes-head.md build-report.md > notes-final.md
          gh release edit "$TAG" --notes-file notes-final.md
          echo "release body updated:"
          gh release view "$TAG" --json body -q .body | head -20

      - name: Publish build report to ci-logs
        # Runs on success as well as failure. This sandbox can fetch neither step
        # logs nor artefacts, so the ci-logs branch is the only way to read the
        # lint findings before deciding whether a build is release-worthy —
        # waiting for the release notes would mean publishing first and checking
        # afterwards.
        if: always()
        run: |
          {
            echo "# CI report — run ${{ github.run_id }} / ${{ github.ref_name }} / job ${{ job.status }}"
            echo
            echo "== lint =="
            LINT=app/build/reports/lint-results-debug.txt
            if [ -f "$LINT" ]; then
              # "|| true", not "|| echo 0": grep -c already prints 0 before
              # exiting nonzero, so the fallback was emitting a second line.
              echo "errors:   $(grep -c ': Error:' "$LINT" 2>/dev/null || true)"
              echo "warnings: $(grep -c ': Warning:' "$LINT" 2>/dev/null || true)"
              echo
              echo "-- every error-severity finding --"
              grep ': Error:' "$LINT" | head -80 || echo "(none)"
              echo
              echo "-- correctness categories, any severity --"
              grep -E '\[(NewApi|InlinedApi|MissingPermission|StaticFieldLeak)\]' "$LINT" | head -40 || echo "(none)"
              echo
              echo "-- issue ids by frequency --"
              grep -oE '\[[A-Za-z]+\]$' "$LINT" | sort | uniq -c | sort -rn | head -25 || true
              echo
              echo "-- report tail --"
              tail -4 "$LINT"
            else
              echo "(no lint report produced)"
              tail -n 40 lint-console.log 2>/dev/null || true
            fi
            echo
            echo "== unit test results =="
            for f in $(find app/build/test-results -name '*.xml' 2>/dev/null | head -20); do
              echo "-- $f --"
              grep -oE '(testsuite name="[^"]*" tests="[0-9]*"[^>]*|testcase name="[^"]*"|<failure[^>]*message="[^"]{0,300})' "$f" | head -60
            done
            echo
            echo "== build outputs =="
            find app/build/outputs -type f 2>/dev/null | head -40 || echo "(none)"
            echo
            echo "== artefact collection =="
            cat collect.log 2>/dev/null || echo "(collect step did not run)"
            echo
            echo "== compiler errors =="
            # Grepped explicitly rather than left to the tail window below: a
            # Kotlin failure prints a long stacktrace after the "e:" lines, which
            # pushed them out of a fixed tail and left nothing to diagnose from.
            grep -E "^e: " build-console.log 2>/dev/null | head -80 || echo "(none)"
            echo
            echo "== compiler warnings (sample) =="
            grep -E "^w: " build-console.log 2>/dev/null | head -30 || echo "(none)"
            echo
            echo "== failure summary =="
            grep -A 14 "^\* What went wrong:" build-console.log 2>/dev/null | head -40 || echo "(none)"
            echo
            echo "== gradle console (tail 250) =="
            tail -n 250 build-console.log 2>/dev/null || echo "(no console log)"
            echo
            echo "== environment =="
            df -h / | tail -1
            java -version 2>&1 | head -2
            gradle --version 2>&1 | grep -E "Gradle|JVM:" || true
          } > ci-report.log
          wc -l ci-report.log
          git config user.name "ci-log-bot"
          git config user.email "ci@localhost"
          git add -f ci-report.log
          git rm -q --cached ci-failure.log 2>/dev/null || true
          git commit -q -m "ci: report for run ${{ github.run_id }} (${{ job.status }})" || echo "nothing to commit"
          git push origin HEAD:refs/heads/ci-logs --force || echo "log push failed"
