# Builds the Android APK and attaches it to the GitHub Release for the tag.
#
# WHY CI AND NOT A SANDBOX: an APK needs aapt2 + d8 + apksigner from Android
# build-tools, and Gradle + the Android Gradle plugin from Google's Maven host.
# Those only download from dl.google.com / services.gradle.org, which restricted
# environments block at the TLS layer. GitHub runners have full network access
# and a preinstalled Android SDK/NDK, so they are the build machine.
#
# Triggered by pushing a tag (v*) or manually from the Actions tab.

name: android-apk

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to upload the APK to the release

jobs:
  apk:
    name: Build APK (python-for-android)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
        # Runners currently default to a very new JDK (25). p4a's Gradle/AGP
        # combination is validated against 17; a too-new javac fails the Gradle
        # build with errors that look unrelated to Java at all.

      - name: Build the web UI (packaged into the APK as assets)
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/index.html

      - name: Install build system packages
        # python-for-android compiles CPython and its recipes from source, so it
        # needs the usual autotools/zlib/lzma/ssl headers. Runners have most of
        # these, but a missing one fails deep inside a recipe with a confusing
        # error, so install the known set explicitly.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential autoconf automake libtool \
            pkg-config zlib1g-dev liblzma-dev libssl-dev libffi-dev git ccache

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          # Cython is pinned ON PURPOSE: python-for-android validates the Cython
          # version at startup and exits before writing any log when it sees one
          # it was not tested against. 3.0.x is what current p4a supports.
          python -m pip install buildozer "cython==3.0.11" setuptools
          buildozer --version
          python -c "import Cython; print('cython', Cython.__version__)"

      - name: Seed buildozer's SDK dir and pin the NDK
        id: ndk
        # Two failure modes this prevents, both observed in CI:
        #
        # 1. Licence prompt. buildozer runs sdkmanager non-interactively into its
        #    OWN sdk dir, so "Accept? (y/N)" gets EOF, defaults to N, and
        #    build-tools is silently skipped -> later "Aidl not found".
        # 2. Half-seeded dir. Creating that dir with ONLY licenses/ makes
        #    buildozer believe an SDK exists, so it never installs cmdline-tools,
        #    then dies with "sdkmanager ... does not exist".
        #
        # So: accept licences on the runner SDK, then hardlink-copy the COMPLETE
        # licensed SDK (cmdline-tools, platforms, build-tools, licenses) into the
        # exact path buildozer uses. cp -al keeps it fast and near-free of disk.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK"
          cp -al "$ANDROID_HOME"/. "$SDK"/ || cp -r "$ANDROID_HOME"/. "$SDK"/
          echo "seeded SDK at $SDK:"; ls "$SDK"

          PINNED="26.1.10909125"
          if [ ! -d "$ANDROID_HOME/ndk/$PINNED" ]; then
            echo "installing ndk;$PINNED"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$PINNED" > /dev/null
          fi
          echo "ndk=$ANDROID_HOME/ndk/$PINNED" >> "$GITHUB_OUTPUT"
          echo "Using NDK: $ANDROID_HOME/ndk/$PINNED"

      - name: Cache the p4a/buildozer toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android/.build
          key: buildozer-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Cross-compile ffmpeg for Android (arm64 + armv7)
        # Non-fatal ON PURPOSE. The APK is the deliverable; a bundled ffmpeg only
        # adds HD muxing + compatibility transcoding on device. If the
        # cross-compile regresses, shipping an APK that degrades to pre-merged
        # streams (and says so in the status badge) beats shipping nothing.
        continue-on-error: true
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk }}
        run: |
          if bash android/ffmpeg_ndk_build.sh both; then
            echo "FFMPEG_BUNDLED=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::ffmpeg cross-compile failed; APK will ship without on-device ffmpeg"
            echo "FFMPEG_BUNDLED=no" >> "$GITHUB_ENV"
          fi

      - name: Stage engine + UI into android/
        run: bash android/prepare.sh

      - name: Build the APK
        working-directory: android
        # No SDK/NDK env vars on purpose: buildozer ignored every name tried and
        # manages its own toolchain under ~/.buildozer. The seeding step above is
        # what actually controls which SDK it gets.
        # tee, don't just run: when buildozer dies before creating its own log
        # (spec validation, Cython check), the console output is the ONLY record
        # of why, and step logs are unfetchable from restricted environments.
        run: |
          set +e
          buildozer -v android debug 2>&1 | tee buildozer-console.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Publish build logs on failure
        # The runner's step logs live on a host that restricted environments
        # cannot fetch, which makes CI failures here undiagnosable from a
        # sandbox. So on failure, push the interesting log tails to a ci-logs
        # branch, which IS readable via plain git.
        if: failure()
        run: |
          {
            echo "# CI failure log — run ${{ github.run_id }} / ${{ github.ref_name }}"
            echo
            echo "== buildozer-console.log (tail 250) =="
            tail -250 android/buildozer-console.log 2>/dev/null || echo "(no console log)"
            echo
            echo "== buildozer.log (tail 200) =="
            tail -200 android/.build/buildozer.log 2>/dev/null || echo "(no buildozer.log)"
            for f in $(find android/.build ~/.buildozer -name '*.log' -o -name '*.txt' 2>/dev/null | head -25); do
              echo
              echo "== $f (tail 80) =="
              tail -80 "$f"
            done
          } > ci-failure.log
          wc -l ci-failure.log
          git config user.name "ci-log-bot"
          git config user.email "ci@localhost"
          git add -f ci-failure.log
          git commit -q -m "ci: failure logs for run ${{ github.run_id }}" || echo "nothing to commit"
          git push origin HEAD:refs/heads/ci-logs --force || echo "log push failed"

      - name: Rename artefact
        id: artefact
        run: |
          TAG="${GITHUB_REF_NAME:-untagged}"
          APK="$(ls android/*.apk | head -1)"
          NAME="video-downloader-${TAG}-android-debug.apk"
          mv "$APK" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la "$NAME"

      - name: Upload APK as a workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: ${{ steps.artefact.outputs.name }}
          retention-days: 30

      - name: Attach APK to the release for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK: ${{ steps.artefact.outputs.name }}
        run: |
          # The release is normally created by the maintainer when tagging;
          # create it here too so a tag pushed without one still ends up with
          # an APK attached rather than an empty release.
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" "$APK" --clobber
          echo "Attached $APK to release $TAG"
