# Builds the Android APK and attaches it to the GitHub Release for the tag.
#
# WHY CI AND NOT A SANDBOX: an APK needs aapt2 + d8 + apksigner from Android
# build-tools, and Gradle + the Android Gradle plugin from Google's Maven host.
# Those only download from dl.google.com / services.gradle.org, which restricted
# environments block at the TLS layer. GitHub runners have full network access
# and a preinstalled Android SDK/NDK, so they are the build machine.
#
# Triggered by pushing a tag (v*) or manually from the Actions tab.

name: android-apk

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to upload the APK to the release

jobs:
  apk:
    name: Build APK (python-for-android)
    # ubuntu-22.04 ON PURPOSE, not ubuntu-latest.
    #
    # p4a's libffi recipe runs autoreconf against libffi's autotools build
    # system, and libffi's configure.ac calls LT_SYS_SYMBOL_USCORE - a macro
    # that libtool 2.4.7 (ubuntu-24.04) and 2.5 (ubuntu-26) have REMOVED. Both
    # fail with "possibly undefined macro: LT_SYS_SYMBOL_USCORE" ~20 minutes in.
    # libtool 2.4.6 on ubuntu-22.04 still defines it, and 22.04 is the image
    # python-for-android's own CI builds on.
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
        # Runners currently default to a very new JDK (25). p4a's Gradle/AGP
        # combination is validated against 17; a too-new javac fails the Gradle
        # build with errors that look unrelated to Java at all.

      - name: Build the web UI (packaged into the APK as assets)
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/index.html

      - name: Install build system packages
        # python-for-android compiles CPython and its recipes from source, so it
        # needs the usual autotools/zlib/lzma/ssl headers. Runners have most of
        # these, but a missing one fails deep inside a recipe with a confusing
        # error, so install the known set explicitly.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential autoconf automake libtool \
            pkg-config zlib1g-dev liblzma-dev libssl-dev libffi-dev git ccache

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          # Cython is pinned ON PURPOSE: python-for-android validates the Cython
          # version at startup and exits before writing any log when it sees one
          # it was not tested against. 3.0.x is what current p4a supports.
          python -m pip install buildozer "cython==3.0.11" setuptools
          buildozer --version
          python -c "import Cython; print('cython', Cython.__version__)"

      # NO caching of build state, on purpose.
      #
      # Two separate CI failures came from restoring stale state: ~/.buildozer
      # (a licenses-only SDK dir clobbered the seeded one) and android/.build (a
      # half-built p4a venv whose pip was mid-upgrade when an earlier run died,
      # restored as a site-packages with mixed pip versions ->
      # "ImportError: cannot import name 'BuildDependencyInstallError'").
      #
      # A from-scratch p4a build costs ~20 minutes; a poisoned cache costs
      # iterations of that. Not worth it until the build is green and stable.

      - name: Seed buildozer's SDK dir and pin the NDK
        id: ndk
        # Failure modes this prevents, all observed in CI:
        #
        # 1. Licence prompt. buildozer runs sdkmanager non-interactively into its
        #    OWN sdk dir, so "Accept? (y/N)" gets EOF, defaults to N, and
        #    build-tools is silently skipped -> later "Aidl not found".
        # 2. Half-seeded dir. A dir containing ONLY licenses/ makes buildozer
        #    believe an SDK exists, so it never installs cmdline-tools, then dies
        #    with "sdkmanager ... does not exist".
        # 3. Stale state from a previous run's cache. Hence rm -rf first: seeding
        #    must be idempotent, not additive.
        #
        # So: accept licences on the runner SDK, then copy the COMPLETE licensed
        # SDK (cmdline-tools, platforms, build-tools, licenses) into the exact
        # path buildozer uses.
        run: |
          set -x
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          rm -rf "$SDK"
          mkdir -p "$SDK"
          cp -a "$ANDROID_HOME"/. "$SDK"/
          echo "seeded SDK at $SDK:"; ls -la "$SDK"; df -h "$SDK" | tail -1

          # This buildozer looks for sdkmanager at the LEGACY path
          #   <sdk>/tools/bin/sdkmanager
          # but SDKs have shipped it at cmdline-tools/latest/bin/ for years, so a
          # seeded (or runner) SDK always fails its check with
          #   "sdkmanager path ... does not exist, sdkmanager is notinstalled"
          # and exits. Symlinking the legacy path onto the real binary satisfies
          # the check, and with licences already accepted its follow-up
          # build-tools install then succeeds instead of being skipped.
          mkdir -p "$SDK/tools/bin"
          for t in sdkmanager avdmanager apksigner lint; do
            [ -f "$SDK/cmdline-tools/latest/bin/$t" ] && \
              ln -sf "$SDK/cmdline-tools/latest/bin/$t" "$SDK/tools/bin/$t"
          done
          ls -la "$SDK/tools/bin/"

          PINNED="26.1.10909125"
          if [ ! -d "$ANDROID_HOME/ndk/$PINNED" ]; then
            echo "installing ndk;$PINNED"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$PINNED" > /dev/null || true
          fi
          echo "ndk=$ANDROID_HOME/ndk/$PINNED" >> "$GITHUB_OUTPUT"
          echo "Using NDK: $ANDROID_HOME/ndk/$PINNED"

      - name: Cross-compile ffmpeg for Android (arm64 + armv7)
        # Non-fatal ON PURPOSE. The APK is the deliverable; a bundled ffmpeg only
        # adds HD muxing + compatibility transcoding on device. If the
        # cross-compile regresses, shipping an APK that degrades to pre-merged
        # streams (and says so in the status badge) beats shipping nothing.
        continue-on-error: true
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk }}
        run: |
          if bash android/ffmpeg_ndk_build.sh both; then
            echo "FFMPEG_BUNDLED=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::ffmpeg cross-compile failed; APK will ship without on-device ffmpeg"
            echo "FFMPEG_BUNDLED=no" >> "$GITHUB_ENV"
          fi

      - name: Stage engine + UI into android/
        run: bash android/prepare.sh

      - name: Build the APK
        working-directory: android
        # No SDK/NDK env vars on purpose: buildozer ignored every name tried and
        # manages its own toolchain under ~/.buildozer. The seeding step above is
        # what actually controls which SDK it gets.
        # tee, don't just run: when buildozer dies before creating its own log
        # (spec validation, Cython check), the console output is the ONLY record
        # of why, and step logs are unfetchable from restricted environments.
        run: |
          set +e
          buildozer -v android debug 2>&1 | tee buildozer-console.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Publish build logs on failure
        # The runner's step logs live on a host that restricted environments
        # cannot fetch, which makes CI failures here undiagnosable from a
        # sandbox. So on failure, push the interesting log tails to a ci-logs
        # branch, which IS readable via plain git.
        if: failure()
        run: |
          {
            echo "# CI failure log — run ${{ github.run_id }} / ${{ github.ref_name }}"
            echo
            echo "== environment =="
            df -h / /home 2>/dev/null | tail -3
            echo "-- \$HOME/.buildozer (top 2 levels) --"
            find "$HOME/.buildozer" -maxdepth 2 2>/dev/null | head -30
            echo "-- buildozer SDK dir --"
            ls -la "$HOME/.buildozer/android/platform/android-sdk" 2>/dev/null | head -20 || echo "(absent)"
            echo
            echo "== buildozer-console.log (tail 400) =="
            tail -400 android/buildozer-console.log 2>/dev/null || echo "(no console log)"
            echo
            echo "== buildozer.log (tail 300) =="
            tail -300 android/.build/buildozer.log 2>/dev/null || echo "(no buildozer.log)"
            # *.log ONLY. Globbing *.txt here pulled in CPython sources,
            # googletest golden output and NOTICE.txt from the build trees,
            # which made grepping this file for the real error useless.
            for f in $(find android/.build ~/.buildozer -name '*.log' 2>/dev/null | head -25); do
              echo
              echo "== $f (tail 80) =="
              tail -80 "$f"
            done
          } > ci-failure.log
          wc -l ci-failure.log
          git config user.name "ci-log-bot"
          git config user.email "ci@localhost"
          git add -f ci-failure.log
          git commit -q -m "ci: failure logs for run ${{ github.run_id }}" || echo "nothing to commit"
          git push origin HEAD:refs/heads/ci-logs --force || echo "log push failed"

      - name: Rename artefact
        id: artefact
        run: |
          set -x
          TAG="${GITHUB_REF_NAME:-untagged}"
          NAME="video-downloader-${TAG}-android-debug.apk"
          # buildozer/p4a write the APK to android/bin/, NOT android/.
          # Look there first, then anywhere under the build tree, newest first.
          APK="$(ls -t android/bin/*.apk 2>/dev/null | head -1 || true)"
          if [ -z "$APK" ]; then
            APK="$(find android -maxdepth 5 -name '*.apk' -type f -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2- || true)"
          fi
          if [ -z "$APK" ]; then
            echo "ERROR: no .apk produced"
            ls -la android android/bin 2>/dev/null || true
            find android -maxdepth 3 -type d 2>/dev/null | head -40
            exit 1
          fi
          echo "found APK: $APK"
          ls -la "$APK"
          cp "$APK" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la "$NAME"

      - name: Upload APK as a workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: ${{ steps.artefact.outputs.name }}
          retention-days: 30

      - name: Attach APK to the release for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK: ${{ steps.artefact.outputs.name }}
        run: |
          # The release is normally created by the maintainer when tagging;
          # create it here too so a tag pushed without one still ends up with
          # an APK attached rather than an empty release.
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" "$APK" --clobber
          echo "Attached $APK to release $TAG"

      - name: Publish an APK contents report
        # Always runs, and pushes to the readable ci-logs branch. Step logs live
        # on a host restricted environments cannot fetch, and release assets
        # redirect to objects.githubusercontent.com which is also unreachable
        # from the sandbox - so this report is the only way to verify what the
        # APK actually contains (bundled ffmpeg? yt-dlp? the UI?) without
        # downloading 30 MB through a blocked host.
        if: always()
        env:
          APK: ${{ steps.artefact.outputs.name }}
          FFMPEG_BUNDLED: ${{ env.FFMPEG_BUNDLED }}
        run: |
          python3 - > apk-report.txt 2>&1 <<'PY'
          import hashlib, os, zipfile
          apk = os.environ.get('APK') or ''
          print('APK:', apk, '| exists:', os.path.exists(apk))
          print('FFMPEG_BUNDLED:', os.environ.get('FFMPEG_BUNDLED'))
          print('== staged ffmpeg binaries (android/assets/ffmpeg) ==')
          found = False
          for root, _dirs, files in os.walk('android/assets/ffmpeg'):
              for f in files:
                  p = os.path.join(root, f)
                  print('   ', p, os.path.getsize(p), 'bytes'); found = True
          if not found:
              print('    (none)')
          if not os.path.exists(apk):
              raise SystemExit('no APK to inspect')
          size = os.path.getsize(apk)
          print(f'== APK ==\nsize: {size} bytes ({size/1048576:.1f} MiB)')
          with open(apk, 'rb') as fh:
              print('sha256:', hashlib.sha256(fh.read()).hexdigest())
          z = zipfile.ZipFile(apk)
          names = z.namelist()
          print('zip entries:', len(names))
          for pat in ['AndroidManifest.xml', 'classes', 'lib/', 'assets/']:
              hits = [n for n in names if pat in n]
              print(f'-- outer entries matching {pat!r}: {len(hits)}')
              for h in hits[:40]:
                  print(f'     {h}  ({z.getinfo(h).file_size} bytes)')
          # p4a packs the Python runtime + our app sources into assets/private.mp3,
          # which is itself a zip. Unpack it to prove the app code shipped.
          try:
              blob = z.read('assets/private.mp3')
          except KeyError:
              print('== no assets/private.mp3 ==')
          else:
              open('/tmp/private.zip', 'wb').write(blob)
              pz = zipfile.ZipFile('/tmp/private.zip')
              pn = pz.namelist()
              print(f'== assets/private.mp3: {len(pn)} entries ==')
              for key in ['main.py', 'devserver.py', 'engine/', 'dist/', 'yt_dlp', 'ffmpeg']:
                  hits = [n for n in pn if key in n]
                  print(f'   {key:14} -> {len(hits):5d}', hits[:4])
          PY
          cat apk-report.txt
          git config user.name "ci-log-bot"
          git config user.email "ci@localhost"
          git add -f apk-report.txt
          git commit -q -m "ci: APK contents report for run ${{ github.run_id }}" || echo "nothing to commit"
          git push origin HEAD:refs/heads/ci-logs --force || echo "report push failed"
